name: hydralog
description: "A daily hydration tracker."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  intl: ^0.17.0
  flutter_local_notifications: ^17.1.0
  permission_handler: ^11.3.1
  timezone: ^0.9.2
  provider: ^6.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  fonts:
    - family: Orbitron
      fonts:
        - asset: fonts/Orbitron-Regular.ttf

  uses-material-design: true

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon.jpg"
